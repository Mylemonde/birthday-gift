<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小豆子生日快乐</title>
<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="./css/cover-enhancements.css">
<link rel="stylesheet" href="./css/finale.css">
</head>
<body>
<section id="cover">
<div class="cover-atmosphere" aria-hidden="true">
  <div class="nebula nebula-pink"></div>
  <div class="nebula nebula-blue"></div>
  <div class="gift-orbits"><i></i><i></i></div>
  <span class="wish wish-one">a sky full of wishes</span>
  <span class="wish wish-two">all my love, for you</span>
<span class="cover-heart" style="--left:8%;--delay:-0.0s">♡</span>
<span class="cover-heart" style="--left:18%;--delay:-1.4s">♡</span>
<span class="cover-heart" style="--left:28%;--delay:-2.8s">♡</span>
<span class="cover-heart" style="--left:38%;--delay:-4.199999999999999s">♡</span>
<span class="cover-heart" style="--left:48%;--delay:-5.6s">♡</span>
<span class="cover-heart" style="--left:58%;--delay:-7.0s">♡</span>
<span class="cover-heart" style="--left:68%;--delay:-8.399999999999999s">♡</span>
<span class="cover-heart" style="--left:78%;--delay:-9.799999999999999s">♡</span>
<span class="cover-heart" style="--left:88%;--delay:-11.2s">♡</span>
</div>
<div class="cover-date">YOUR BIRTHDAY LETTER</div>
<div class="cover-kicker">A GIFT, JUST FOR YOU</div>
<h2 class="cover-title">有一份偏爱，等你拆开</h2>
<p class="cover-description">把星光、鲜花和心愿，都藏进这份礼物里</p>
<button id="gift" aria-label="拆开生日礼物，开始动画">
<span class="gift-body">
</span>
<span class="gift-band">
</span>
<span class="gift-lid">
</span>
<span class="bow left">
</span>
<span class="bow right">
</span>
<span class="bow-knot">
</span>
<span class="gift-spark s1">✧</span>
<span class="gift-spark s2">✧</span>
<span class="gift-spark s3">✦</span>
</button>
<div class="cover-note">轻触礼物盒 · 开启生日惊喜</div>
<div class="birthday-keepsake"><span class="keepsake-age">22</span><div class="keepsake-copy"><b>MAKE A LITTLE WISH</b><span>愿这一岁，浪漫与快乐都属于你</span></div></div>
<div class="cover-foot">For your twenty-second birthday ♡</div>
</section>
<canvas id="meteorSky" aria-hidden="true">
</canvas>
<canvas id="c">
</canvas>
<header>
<span>ONLY FOR YOU</span>
<span>TWENTY TWO · ♡</span>
</header>
<div class="copy">
<h1 id="title">把喜欢，写进每一束光里</h1>
<p id="sub">一场只属于你的生日惊喜</p>
</div>
<img id="photo" src="./assets/photo.jpg" alt="寿星的照片">
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
<defs>
<clipPath id="roundedHeart" clipPathUnits="objectBoundingBox">
<path d="M .5 .975 C .43 .91 .055 .66 .018 .37 C -.025 .075 .30 -.085 .5 .17 C .70 -.085 1.025 .075 .982 .37 C .945 .66 .57 .91 .5 .975 Z"/>
</clipPath>
</defs>
</svg>
<div id="wall" aria-label="24张照片组成的爱心照片墙">
</div>
<img id="finalPortrait" src="./assets/birthday-finale.jpg" alt="豆小雨的生日照片">
<button id="replay">再看一次 ↻</button>
<div id="count">
</div>
<div id="bar">
</div>
<script src="./js/config.js" defer>
</script>
<script src="./js/core.js" defer>
</script>
<script src="./js/canvas-assets.js" defer></script>
<script src="./js/flowers.js" defer>
</script>
<script src="./js/cake.js" defer>
</script>
<script src="./js/experience.js" defer>
</script>
<script src="./js/meteors.js" defer>
</script>
</body>
</html>
